# Flow 1: sign in, see an empty account, sign out.
appId: com.samilabud.plantpal.dev
name: Sign in and out
---
- evalScript: ${output.user = 'signin-' + Date.now()}
- runFlow: subflows/launch-clean.yaml
- assertVisible: Never forget to water a plant again.
- runFlow:
    file: subflows/sign-in.yaml
    env:
      USER: ${output.user}
- assertVisible: No plants yet
- takeScreenshot: e2e/screenshots/1-signed-in
# Deep link instead of tapping the header: in development builds the dev client's floating
# tools button sits on top of the header's Settings link (it doesn't exist in release builds).
- openLink: plantpal-dev://settings
- assertVisible: ${output.user + '@dev.plantpal.test'}
- scrollUntilVisible:
    element:
      id: sign-out
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: dev-sign-in
    timeout: 20000
- takeScreenshot: e2e/screenshots/1-signed-out
