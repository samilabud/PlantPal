# Local Postgres for development and tests. Production uses Neon.
# Port 5433 avoids clashing with a Homebrew Postgres on 5432.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plantpal
      POSTGRES_PASSWORD: plantpal
      POSTGRES_DB: plantpal
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plantpal']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
