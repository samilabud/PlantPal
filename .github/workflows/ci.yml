name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: plantpal
          POSTGRES_PASSWORD: plantpal
          POSTGRES_DB: plantpal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plantpal" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      # Test-only values for the throwaway CI container. Not secrets.
      DATABASE_URL: postgres://plantpal:plantpal@localhost:5432/plantpal_test
      JWT_SECRET: test-only-secret-not-used-anywhere-real-0123456789
      APPLE_CLIENT_IDS: com.samilabud.plantpal.dev
      GOOGLE_CLIENT_IDS: test-web-client.apps.googleusercontent.com
      ALLOW_DEV_AUTH: 'true'
      CRON_SECRET: test-only-cron-secret-0123456789
      REVENUECAT_WEBHOOK_AUTH: Bearer test-only-webhook-auth
      REVENUECAT_WEBHOOK_SECRET: test-only-webhook-signing-secret
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Scans the whole history on every push. (The gitleaks action scans "first commit^..last",
      # which fails on a repo's first push because the root commit has no parent.)
      - name: Scan for committed secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
